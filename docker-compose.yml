services:
  # BD1: MySQL para mensajes de texto
  mysql-bd1:
    image: mysql:8.0
    container_name: mysql-bd1-texto
    command: 
      - --skip-log-bin
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_doublewrite=0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bd1_texto
    ports:
      - "3308:3306"
    volumes:
      - ./bases_de_datos/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BD2: PostgreSQL para correos
  postgres-bd2:
    image: postgres:15
    container_name: postgres-bd2-correo
    # Apagamos las confirmaciones estrictas de disco para acelerar el inicio
    command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: bd2_correo
    ports:
      - "5432:5432"
    volumes:
      - ./bases_de_datos/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d bd2_correo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BD3: MariaDB para usuarios, cuentas y préstamos
  mariadb-bd3:
    image: mariadb:10.11
    container_name: mariadb-bd3-prestamos
    # Desactivamos logs binarios y relajamos la escritura en InnoDB
    command: 
      - --skip-log-bin
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_doublewrite=0
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: bd3_prestamos
    ports:
      - "3307:3306" # Mapeado al 3307 en el host
    volumes:
      - ./bases_de_datos/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Middleware: RabbitMQ con panel de administración
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-middleware
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672"   # Puerto para comunicación AMQP
      - "15672:15672" # Panel de control web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s # Le damos 40 segundos de pura gracia para que despierte con calma

  # NODO TEXTO (Gestión de BD1 con Python)
  nodo-texto:
    build:
      context: ./codigo_fuente/nodo-texto
    container_name: app-nodo-texto
    depends_on:
      mysql-bd1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # NODO CORREO (Gestión de BD2 con Java)
  nodo-correo:
    build:
      context: ./codigo_fuente/nodo-correo
    container_name: app-nodo-correo
    depends_on:
      postgres-bd2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # NODO PRÉSTAMO (Gestión de BD3 con Node.js)
  nodo-prestamo:
    build:
      context: ./codigo_fuente/nodo-prestamo
    container_name: app-nodo-prestamo
    depends_on:
      mariadb-bd3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # NODO IA (Node.js)
  nodo-ia:
    build:
      context: ./codigo_fuente/nodo-ia
    container_name: app-nodo-ia
    depends_on:
      rabbitmq:
        condition: service_healthy